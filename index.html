<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Wi-Fi точки Костромской области</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Боковая панель -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div>
          <h1>📶 Wi‑Fi точки</h1>
          <p>Костромская область</p>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="theme-btn" id="themeBtn" title="Переключить тему">🌙</button>
          <button class="theme-btn" id="toggleSidebar" title="Скрыть панель" style="display:none;">✕</button>
        </div>
      </div>

      <!-- Поиск -->
      <input class="search-input" id="searchInput" placeholder="🔍 Поиск по названию, адресу, организации..." />

      <!-- Статистика -->
      <div class="stats">
        <div class="stat-item">
          <div class="number blue" id="totalCount">0</div>
          <div class="label">Всего</div>
        </div>
        <div class="stat-item">
          <div class="number green" id="freeCount">0</div>
          <div class="label">Бесплатных</div>
        </div>
        <div class="stat-item">
          <div class="number orange" id="freePercent">0%</div>
          <div class="label">% бесплатных</div>
        </div>
        <div class="stat-item">
          <div class="number purple" id="regionCount">0</div>
          <div class="label">Районов</div>
        </div>
      </div>

      <!-- Кнопки анимаций -->
      <div class="filter-section">
        <h3>🎬 Анимации</h3>
        <div class="filter-group">
          <button class="btn btn-primary" id="flightBtn" style="flex:1;">✈️ Полет по области</button>
          <button class="btn btn-secondary" id="resetViewBtn" style="flex:1;">🔄 Сброс вида</button>
        </div>
      </div>

      <!-- Фильтр по типу доступа -->
      <div class="filter-section">
        <h3>Тип доступа</h3>
        <div class="filter-group" id="typeFilters">
          <span class="chip active" data-type="all">
            <span class="dot" style="background:#4cc9f0;"></span> Все
          </span>
          <span class="chip" data-type="free">
            <span class="dot" style="background:#66ffcd;"></span> Бесплатный
          </span>
          <span class="chip" data-type="auth">
            <span class="dot" style="background:#ffd54f;"></span> По запросу
          </span>
        </div>
      </div>

      <!-- Фильтр по району -->
      <div class="filter-section">
        <h3>Район</h3>
        <div class="filter-group" id="regionFilters">
          <span class="chip active" data-region="all">Все</span>
        </div>
      </div>

      <!-- Список точек -->
      <div class="points-list" id="pointsList"></div>

      <!-- Кнопки управления -->
      <div class="sidebar-actions">
        <button class="btn btn-primary" id="resetBtn">🔄 Сбросить фильтры</button>
        <button class="btn btn-secondary" id="locateBtn">📍 Моё место</button>
      </div>
    </aside>

    <!-- Контейнер карты -->
    <div id="map-container">
      <div id="map">
        <div class="loading" id="loading">
          <div class="spinner"></div>
          Загрузка карты...
        </div>
      </div>

      <!-- Информационная панель -->
      <div class="info-panel" id="infoPanel">
        <button class="close-btn" id="closeInfo">✕</button>
        <h3 id="infoTitle">Название</h3>
        <div class="address" id="infoAddress">Адрес</div>
        <div class="details">
          <div class="detail-item"><span class="tag">Район:</span> <span id="infoRegion">—</span></div>
          <div class="detail-item"><span class="tag">Скорость:</span> <span id="infoSpeed">—</span></div>
          <div class="detail-item"><span class="tag">Тип:</span> <span id="infoType">—</span></div>
          <div class="detail-item"><span class="tag">Организация:</span> <span id="infoOrg">—</span></div>
        </div>
        <div id="infoBadge"></div>
        <button class="route-btn" id="routeBtn">🚶 Построить маршрут</button>
        <button class="route-btn" style="margin-top:4px;background:rgba(255,255,255,0.1);color:#e8edf5;" id="deleteCustomBtn">🗑️ Удалить эту метку</button>
      </div>
    </div>
  </div>

  <!-- Кнопка показа панели на мобильных -->
  <button class="toggle-sidebar-btn" id="mobileToggleBtn">☰</button>

  <!-- Яндекс.Карты API -->
  <script src="https://api-maps.yandex.ru/v3/?apikey=788065bd-6b22-4b97-935d-356febc5c27a&lang=ru_RU"></script>

  <!-- Подключаем основной скрипт -->
  <script src="app.js"></script>

  <script>
    // Мобильное переключение панели
    document.addEventListener('DOMContentLoaded', () => {
      const mobileBtn = document.getElementById('mobileToggleBtn');
      const sidebar = document.getElementById('sidebar');
      let sidebarVisible = window.innerWidth > 820;

      if (mobileBtn) {
        mobileBtn.addEventListener('click', () => {
          sidebarVisible = !sidebarVisible;
          sidebar.classList.toggle('collapsed', !sidebarVisible);
          mobileBtn.textContent = sidebarVisible ? '✕' : '☰';
        });
      }

      window.addEventListener('resize', () => {
        if (window.innerWidth > 820) {
          sidebar.classList.remove('collapsed');
          if (mobileBtn) mobileBtn.textContent = '✕';
          sidebarVisible = true;
        }
      });

      // Кнопка сброса вида
      const resetBtn = document.getElementById('resetViewBtn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          if (window.map) {
            window.map.update({
              location: {
                center: [43.3, 58.3],
                zoom: 8,
                duration: 2
              }
            });
            if (window.showNotification) window.showNotification('🔄 Вид сброшен');
          }
        });
      }

      // Кнопка полёта
      const flightBtn = document.getElementById('flightBtn');
      if (flightBtn && window.startFlightAnimation) {
        flightBtn.addEventListener('click', window.startFlightAnimation);
      }

      // Кнопка удаления пользовательской метки
      const deleteBtn = document.getElementById('deleteCustomBtn');
      if (deleteBtn) {
        deleteBtn.addEventListener('click', () => {
          if (window.deleteCustomPoint) window.deleteCustomPoint();
        });
      }
    });

    // Функция для удаления пользовательской метки
    function deleteCustomPoint() {
      if (!window.currentInfoPoint || !window.currentInfoPoint.isCustom) {
        if (window.showNotification) window.showNotification('❌ Это системная метка, её нельзя удалить');
        return;
      }

      if (window.allPoints && window.renderMarkers) {
        const index = window.allPoints.findIndex(p => p.id === window.currentInfoPoint.id);
        if (index !== -1) {
          window.allPoints.splice(index, 1);
          window.renderMarkers();
          const panel = document.getElementById('infoPanel');
          if (panel) panel.classList.remove('visible');
          if (window.showNotification) window.showNotification('🗑️ Метка удалена');
        }
      }
    }

    window.deleteCustomPoint = deleteCustomPoint;
  </script>
</body>
</html>
